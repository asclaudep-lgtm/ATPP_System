; Параметры развёртывания ATPP в локальной сети.
; Заполните под вашу сеть и запустите setup_server.ps1.

[server]
; IP/имя ПК-сервера, как его видят клиенты в LAN
ServerHost          = 192.168.1.10

; LAN-подсеть, которой разрешён доступ к PostgreSQL и SMB-шаре бэкапов.
; Формат CIDR (PostgreSQL pg_hba.conf).
LanCIDR             = 192.168.1.0/24

[postgresql]
; Версия PostgreSQL для скачивания (если ставим с нуля)
Version             = 16

; Пароль суперпользователя postgres (придумайте сложный, сохраните в надёжном месте)
PostgresPassword    = СуперАдминПароль_Заменить!

; Имя БД и пользователя приложения
AppDb               = atpp
AppUser             = atpp
; Пароль пользователя приложения. Этот же пароль попадёт в data/db.cfg клиентов.
AppPassword         = ПарольПользователяАтпп_Заменить!

[backup]
; Каталог на сервере, в который попадают бэкапы (и сервера, и зеркала клиентов).
; Будет создан и расшарен по сети как ATPP_Backups.
BackupDir           = D:\ATPP_Backups
ShareName           = ATPP_Backups

; Сколько дневных бэкапов хранить локально на сервере.
KeepDaily           = 30

; Время ежедневного бэкапа сервера (HH:mm)
DailyTime           = 23:00
