<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATPP Web v14</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#f97316" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: #f1f5f9; }
    [x-cloak] { display: none !important; }
    .sidebar-link.active { background: rgba(249,115,22,0.12); color: #fb923c; border-left: 3px solid #f97316; }
    .sidebar-link { border-left: 3px solid transparent; }
    .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; display: inline-block; }
    .tag-blue { background: #dbeafe; color: #1e40af; }
    .tag-green { background: #dcfce7; color: #166534; }
    .tag-yellow { background: #fef3c7; color: #854d0e; }
    .tag-red { background: #fee2e2; color: #991b1b; }
    .tag-gray { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
