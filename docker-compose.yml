version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://atpp:atpp_password@db:5432/atpp
      - ATPP_WEB_SECRET=change-this-secret-in-production
      - ATPP_CORS_ORIGINS=http://localhost:8000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atpp
      POSTGRES_PASSWORD: atpp_password
      POSTGRES_DB: atpp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atpp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
