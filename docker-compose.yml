version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${ATPP_DATABASE_URL:-postgresql://atpp:changeme@db:5432/atpp}
      - ATPP_WEB_SECRET=${ATPP_WEB_SECRET:-changeme}
      - ATPP_CORS_ORIGINS=http://localhost:8000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ATPP_POSTGRES_USER:-atpp}
      POSTGRES_PASSWORD: ${ATPP_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${ATPP_POSTGRES_DB:-atpp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATPP_POSTGRES_USER:-atpp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
